name: Phase 12 score and fielding patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/phase12_patch.py
      - name: Commit gameplay patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git diff --cached --quiet || git commit -m "Implement Phase 12 scoring fielding and delivery payload"
          git push
      - name: Remove one-shot patch files
        run: |
          git rm .github/phase12_patch.py .github/workflows/phase12-score-fielding.yml || true
          git diff --cached --quiet || git commit -m "Remove one-shot Phase 12 patch files"
          git push || true
